<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>แบบสอบถามการซื้อขายออนไลน์</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1d2433;--mu:#6b7385;--pr:#4f46e5;--bd:#e3e6ef;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12141b;--card:#1b1f2a;--tx:#e9ecf5;--mu:#98a0b3;--pr:#8b85ff;--bd:#2c3242}}
:root[data-theme="dark"]{--bg:#12141b;--card:#1b1f2a;--tx:#e9ecf5;--mu:#98a0b3;--pr:#8b85ff;--bd:#2c3242}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Noto Sans Thai',system-ui,sans-serif;line-height:1.55}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 80px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;margin-bottom:14px}
h1{font-size:1.5rem;margin:.2em 0}h2{font-size:1.1rem;margin:0 0 10px}
.mu{color:var(--mu);font-size:.9rem}
input[type=text],input[type=password],textarea{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
textarea{min-height:70px}
button{background:var(--pr);color:#fff;border:0;border-radius:10px;padding:10px 20px;font:inherit;font-weight:600;cursor:pointer}
button.g{background:transparent;color:var(--pr);border:1px solid var(--pr)}
button:disabled{opacity:.4;cursor:not-allowed}
.opt{display:flex;gap:8px;align-items:center;padding:7px 4px;cursor:pointer}
.q{margin-bottom:6px}.q b{display:block;margin-bottom:6px}
.sec{color:var(--pr);font-weight:700;margin:22px 0 8px}
.bar{height:6px;background:var(--bd);border-radius:9px;margin-bottom:14px}.bar i{display:block;height:100%;background:var(--pr);border-radius:9px;width:0}
#adm{position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));padding:8px 14px;font-size:.85rem}
.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;z-index:9}
.modal .card{width:min(340px,90%);margin:0}
.tabs{display:flex;gap:8px;margin-bottom:14px}.tabs button{flex:1}
.grid{display:grid;gap:14px}
.pie{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.lg div{display:flex;gap:6px;align-items:center;font-size:.88rem}.lg i{width:11px;height:11px;border-radius:3px;display:inline-block}
.ans{border-top:1px solid var(--bd);padding:8px 0;font-size:.92rem}.ans small{color:var(--mu)}
.big{font-size:2.2rem;font-weight:700;color:var(--pr)}
.err{color:#d33;font-size:.9rem;margin-top:6px}
</style></head><body><div class="wrap" id="app"></div>
<button id="adm" class="g" style="background:var(--card)">⚙ admin</button>
<script>
const C=['#4f46e5','#f59e0b','#10b981','#ef4444','#06b6d4','#a855f7','#84cc16','#f97316'];
// type: c=เลือกตอบ, t=ข้อความ
const S=[
["ส่วนที่ 1 ข้อมูลทั่วไป",[
["role","คุณมีบทบาทอะไรในการซื้อขายออนไลน์?","c",["ผู้ซื้อ","ผู้ขาย","ทั้งซื้อและขาย"]],
["age","ช่วงอายุของคุณ","c",["ต่ำกว่า 18","18-25","26-35","36-45","46 ขึ้นไป"]],
["freq","ซื้อของออนไลน์บ่อยแค่ไหน?","c",["ทุกวัน","สัปดาห์ละครั้งขึ้นไป","เดือนละครั้งขึ้นไป","นานๆ ครั้ง","ไม่เคย"]],
["spend","ใช้จ่ายออนไลน์ต่อเดือนประมาณ","c",["ต่ำกว่า 500 บาท","500-1,500","1,501-5,000","มากกว่า 5,000"]]]],
["ส่วนที่ 2 ช่องทางและพฤติกรรมการซื้อ",[
["plat","แพลตฟอร์มที่ใช้ซื้อมากที่สุด","c",["Shopee","Lazada","TikTok Shop","Facebook/Line","เว็บไซต์ร้านเอง","อื่นๆ"]],
["why","เหตุผลหลักที่เลือกซื้อออนไลน์","c",["ราคาถูกกว่า","สะดวกสบาย","สินค้าหลากหลาย","โปรโมชั่น/ส่วนลด","ไม่มีร้านใกล้บ้าน"]],
["pay","วิธีชำระเงินที่ใช้บ่อยที่สุด","c",["เก็บเงินปลายทาง","โอน/พร้อมเพย์","บัตรเครดิต/เดบิต","E-wallet","ผ่อนชำระ"]],
["trust","ปัจจัยที่ทำให้เชื่อใจร้านค้ามากที่สุด","c",["รีวิว/คะแนนร้าน","ร้านที่มีแพลตฟอร์มรับรอง","ราคาสมเหตุสมผล","มีเลขบัญชี/ตัวตนชัดเจน","คนรู้จักแนะนำ"]],
["live","คุณซื้อของจากไลฟ์สด/คลิปสั้นหรือไม่?","c",["บ่อย","บางครั้ง","ไม่เคย"]]]],
["ส่วนที่ 3 ประสบการณ์และปัญหา",[
["bad","เคยเจอปัญหาจากการซื้อออนไลน์หรือไม่?","c",["ไม่เคย","สินค้าไม่ตรงปก","ส่งช้า/ไม่ส่ง","ถูกโกง","สินค้าเสียหาย"]],
["sat","ความพึงพอใจโดยรวมต่อการซื้อออนไลน์","c",["มากที่สุด","มาก","ปานกลาง","น้อย","น้อยที่สุด"]],
["ship","ค่าส่งและความเร็วในการจัดส่งมีผลต่อการตัดสินใจแค่ไหน?","c",["มากที่สุด","มาก","ปานกลาง","น้อย"]],
["t1","เล่าประสบการณ์ซื้อออนไลน์ที่ประทับใจหรือแย่ที่สุด","t"]]],
["ส่วนที่ 4 สำหรับผู้ขาย (ผู้ซื้อข้ามได้)",[
["sell","คุณขายของออนไลน์ผ่านช่องทางใด?","c",["Shopee/Lazada","TikTok Shop","Facebook/Line/IG","เว็บไซต์ตัวเอง","ไม่ได้ขาย"]],
["inc","รายได้จากการขายออนไลน์ต่อเดือน","c",["ไม่มีรายได้","ต่ำกว่า 10,000","10,000-50,000","มากกว่า 50,000"]],
["sprob","ปัญหาหลักของผู้ขาย","c",["แข่งขันสูง","ค่าธรรมเนียมแพลตฟอร์ม","ลูกค้าคืนสินค้า/โกง","ขนส่ง","ไม่มี/ไม่ได้ขาย"]],
["t2","คุณมีวิธีสร้างความเชื่อมั่นกับลูกค้า/ปฏิสัมพันธ์กับผู้ซื้ออย่างไร?","t"]]],
["ส่วนที่ 5 แนวคิดและอนาคต",[
["fut","คุณคิดว่าการซื้อขายออนไลน์ในอนาคตจะเป็นอย่างไร?","c",["โตขึ้นมาก","โตขึ้นเล็กน้อย","เท่าเดิม","ลดลง"]],
["t3","แนวคิด/ข้อเสนอแนะเพื่อให้การซื้อขายออนไลน์ปลอดภัยและดีขึ้น","t"]]]];
const Q=S.flatMap(s=>s[1]);
let db=null,ans={},name='',all=[],unsub=null;
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
(async()=>{try{db=await claude.use('db')}catch(e){db=null}})();

function home(){app.innerHTML=`<div class="card"><h1>🛒 แบบสอบถามการซื้อขายออนไลน์</h1>
<p class="mu">ทั้งหมด ${Q.length} ข้อ ใช้เวลาประมาณ 5 นาที ทั้งแบบเลือกตอบและเขียนข้อความ</p>
<label class="q"><b>ชื่อของคุณ</b></label><input type="text" id="nm" placeholder="กรอกชื่อ-นามสกุล หรือชื่อเล่น">
<label class="opt"><input type="checkbox" id="ok"> ฉันยืนยันว่าชื่อถูกต้อง และยินยอมให้เก็บข้อมูลเพื่อการสำรวจ</label>
<button id="go" disabled>เริ่มทำแบบสอบถาม</button></div>`;
const u=()=>$('#go').disabled=!($('#nm').value.trim()&&$('#ok').checked);
$('#nm').oninput=u;$('#ok').onchange=u;
$('#go').onclick=()=>{name=$('#nm').value.trim();survey()}}

function survey(){let n=0;
app.innerHTML=`<div class="card"><b>สวัสดีคุณ ${esc(name)}</b><div class="bar"><i id="pb"></i></div></div>`+
S.map(s=>`<div class="sec">${s[0]}</div><div class="card">`+s[1].map(q=>{n++;
return `<div class="q"><b>${n}. ${q[1]}</b>`+(q[2]=='c'?q[3].map(o=>`<label class="opt"><input type="radio" name="${q[0]}" value="${esc(o)}"> ${o}</label>`).join(''):`<textarea data-k="${q[0]}" placeholder="พิมพ์คำตอบ (ไม่บังคับ)"></textarea>`)+`</div><hr style="border:0;border-top:1px solid var(--bd);margin:12px 0">`}).join('')+`</div>`).join('')+
`<div class="err" id="er"></div><button id="sub">ส่งแบบสอบถาม</button>`;
const prog=()=>{const d=Q.filter(q=>q[2]=='c'&&document.querySelector(`input[name=${q[0]}]:checked`)).length,t=Q.filter(q=>q[2]=='c').length;$('#pb').style.width=d/t*100+'%'};
app.onchange=prog;
$('#sub').onclick=async()=>{const r={name,ts:Date.now()};
for(const q of Q){if(q[2]=='c'){const e=document.querySelector(`input[name=${q[0]}]:checked`);if(!e&&!['sell','inc','sprob'].includes(q[0])){$('#er').textContent='กรุณาตอบข้อ: '+q[1];e0(q[0]);return}r[q[0]]=e?e.value:''}else r[q[0]]=document.querySelector(`[data-k=${q[0]}]`).value.trim()}
if(!db){$('#er').textContent='ไม่สามารถบันทึกได้ (ต้องเปิดลิงก์ในบัญชี claude.ai)';return}
$('#sub').disabled=true;
try{await db.collection('responses').add(r);app.innerHTML=`<div class="card"><h1>🎉 ขอบคุณค่ะ/ครับ</h1><p>บันทึกคำตอบของคุณ ${esc(name)} เรียบร้อยแล้ว</p></div>`}catch(e){$('#er').textContent='บันทึกไม่สำเร็จ ลองใหม่อีกครั้ง';$('#sub').disabled=false}}}
function e0(k){const e=document.querySelector(`input[name=${k}]`);e&&e.scrollIntoView({block:'center',behavior:'smooth'})}

// ---- ADMIN ----
$('#adm').onclick=()=>{const m=document.createElement('div');m.className='modal';
m.innerHTML=`<div class="card"><h2>admin</h2><input type="password" id="pw" placeholder="รหัสผ่าน" inputmode="numeric"><div class="err" id="pe"></div><div style="display:flex;gap:8px;margin-top:10px"><button id="pgo">เข้าสู่ระบบ</button><button class="g" id="pc">ยกเลิก</button></div></div>`;
document.body.appendChild(m);$('#pw').focus();
const go=()=>{if($('#pw').value==='32145'){m.remove();dash()}else $('#pe').textContent='รหัสผ่านไม่ถูกต้อง'};
$('#pgo').onclick=go;$('#pw').onkeydown=e=>e.key=='Enter'&&go();$('#pc').onclick=()=>m.remove()};

let tab='c';
function dash(){app.onchange=null;
app.innerHTML=`<div class="card"><h1>📊 Admin Dashboard</h1><div class="mu">จำนวนผู้ตอบแบบสอบถามทั้งหมด</div><div class="big" id="cnt">0</div>
<button class="g" id="out">← กลับหน้าแรก</button></div>
<div class="tabs"><button id="tc">📈 คำตอบแบบเลือก (กราฟ)</button><button id="tt" class="g">📝 คำตอบแบบข้อความ</button></div><div id="body" class="grid"></div>`;
$('#out').onclick=()=>{unsub&&unsub();home()};
$('#tc').onclick=()=>{tab='c';draw()};$('#tt').onclick=()=>{tab='t';draw()};
if(!db){$('#body').innerHTML='<div class="card err">ไม่สามารถเชื่อมต่อฐานข้อมูลได้</div>';return}
unsub=db.collection('responses').onSnapshot(s=>{all=s.docs.map(d=>d.data());draw()},()=>{})}
function draw(){$('#cnt').textContent=all.length;
$('#tc').className=tab=='c'?'':'g';$('#tt').className=tab=='t'?'':'g';
const b=$('#body');
if(tab=='c'){b.innerHTML=Q.filter(q=>q[2]=='c').map(q=>{
const cnt=q[3].map(o=>all.filter(r=>r[q[0]]===o).length),tot=cnt.reduce((a,b)=>a+b,0);
return `<div class="card"><h2>${q[1]}</h2><div class="pie">${pie(cnt,tot)}<div class="lg">${q[3].map((o,i)=>`<div><i style="background:${C[i%8]}"></i>${o} — <b>${cnt[i]}</b> (${tot?Math.round(cnt[i]/tot*100):0}%)</div>`).join('')}</div></div></div>`}).join('')}
else{b.innerHTML=Q.filter(q=>q[2]=='t').map(q=>{const a=all.filter(r=>r[q[0]]);
return `<div class="card"><h2>${q[1]}</h2><div class="mu">${a.length} คำตอบ</div>${a.sort((x,y)=>y.ts-x.ts).map(r=>`<div class="ans">${esc(r[q[0]])}<br><small>— ${esc(r.name)}</small></div>`).join('')||'<div class="mu">ยังไม่มีคำตอบ</div>'}</div>`}).join('')}}
function pie(c,t){if(!t)return '<svg width="150" height="150"><circle cx="75" cy="75" r="60" fill="none" stroke="var(--bd)" stroke-width="28"/></svg>';
const R=60,L=2*Math.PI*R;let off=0;
return `<svg width="150" height="150" viewBox="0 0 150 150" style="transform:rotate(-90deg)">`+c.map((v,i)=>{const d=v/t*L,s=`<circle cx="75" cy="75" r="${R}" fill="none" stroke="${C[i%8]}" stroke-width="28" stroke-dasharray="${d} ${L-d}" stroke-dashoffset="${-off}"/>`;off+=d;return v?s:''}).join('')+`</svg>`}
home();
</script></body></html>
